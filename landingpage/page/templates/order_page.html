

<!--=========================================================-->

{% extends "admin/admin_dashboard.html" %}

{% block title %}Admin Order Page{% endblock title %}

{% block content %}

            <h1 class="text-4xl font-bold text-gray-800 mb-8 ml-20">Dashboard</h1>
            
            <div class="bg-gray-100 p-6">

    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-xl font-bold mb-4">Add Product</h1>
        <form method="post"  class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700">
                Save Product
            </button>
        </form>
    </div>

</div>

<div class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-200 bg-white rounded-xl shadow-lg overflow-hidden">


        <!-- Form Body -->
        <div class="p-6">
            <!-- Delivery Options -->
            <div class="flex items-center gap-2 mb-6">
                <button class="bg-green-600 text-white font-semibold py-1.5 px-4 rounded-full text-sm hover:bg-green-700 transition">
                    Chat on Delivery
                </button>
                <button class="bg-gray-200 text-gray-700 font-semibold py-1.5 px-4 rounded-full text-sm">
                    (COD)
                </button>
            </div>

            <!-- Form Title (Translated from image) -->
            <h3 class="text-center text-gray-700 text-xl mb-6 font-semibold">আপনার তথ্য লিখুন</h3>

            <!-- Input Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input type="text" placeholder="First Name" class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-green-500 transition">
                <input type="text" placeholder="Last Name" class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-green-500 transition">
            </div>
            <div class="mb-4">
                <input type="tel" placeholder="Mobile Number" class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-green-500 transition">
            </div>
            <div class="mb-6">
                <textarea placeholder="Your Address" class="w-full py-3 px-4 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-green-500 transition h-32 resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button class="w-full bg-green-700 text-white font-semibold py-4 px-6 rounded-xl flex items-center justify-center gap-2 hover:bg-green-800 transition">
                <!-- Checkmark Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span>অর্ডার নিশ্চিত করুন</span>
            </button>
        </div>
    </div>
</div>


<script>

        document.addEventListener('DOMContentLoaded', function () {
            // ALL JAVASCRIPT IS THE SAME AS THE PREVIOUS VERSION
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebar-content');
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const desktopSidebarToggle = document.getElementById('desktop-sidebar-toggle');
            const navMenu = document.getElementById('nav-menu');
            const addOrderBtn = document.getElementById('add-order-btn');
            const orderListBody = document.getElementById('order-list-body');

            
            
            
        
            
            function hideDesktopSidebar() {
                sidebar.classList.remove('md:w-64');
                sidebar.classList.add('w-0');
                sidebarContent.classList.replace('opacity-100', 'opacity-0');
                desktopSidebarToggle.classList.remove('sidebar-open-btn-transform');
                
                setTimeout(() => {
                    sidebar.classList.add('hidden');
                }, 300);
            }

            function showDesktopSidebar() {
                sidebar.classList.remove('hidden');
                
                setTimeout(() => {
                    sidebar.classList.remove('w-0');
                    sidebar.classList.add('md:w-64');
                    sidebarContent.classList.replace('opacity-0', 'opacity-100');
                    desktopSidebarToggle.classList.add('sidebar-open-btn-transform');
                }, 10);
            }

            mobileMenuBtn.addEventListener('click', () => {
                navMenu.classList.toggle('hidden');
            });
            
            desktopSidebarToggle.addEventListener('click', () => {
                const isVisible = sidebar.classList.contains('md:w-64');
                if (isVisible) {
                    hideDesktopSidebar();
                } else {
                    showDesktopSidebar();
                }
            });








  

            
            if (sidebar.classList.contains('md:w-64')) {
                desktopSidebarToggle.classList.add('sidebar-open-btn-transform');
            }
            renderOrders();
            


            
        });
    </script>
    
{% endblock content %}
