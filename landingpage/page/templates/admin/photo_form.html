<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sidebar-open-btn-transform {
            transform: translateX(16rem); /* 16rem is the width of the sidebar (w-64) */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

   <form class="w-1/3 mx-auto my-20 " action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{form}}
<button type="submit" 
        class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500
               text-white font-bold py-3 px-6 rounded-lg shadow-lg
               hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600
               active:scale-95 transition-transform duration-200">
    Submit
</button>
   </form>
</body>
</html>
