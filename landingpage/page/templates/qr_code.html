{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">QR Code Generator</h1>

    <!-- Input text -->
    <input id="qrText" type="text" placeholder="Enter text or URL"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 mb-4">

    <!-- Options -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Size</label>
        <input id="qrSize" type="number" value="200" min="100" max="500"
          class="w-full px-2 py-1 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Foreground</label>
        <input id="qrColorDark" type="color" value="#000000"
          class="w-full h-10 border rounded-lg cursor-pointer">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Background</label>
        <input id="qrColorLight" type="color" value="#ffffff"
          class="w-full h-10 border rounded-lg cursor-pointer">
      </div>
    </div>

    <!-- Generate button -->
    <button onclick="generateQR()" 
      class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg transition">
      Generate QR Code
    </button>

    <!-- QR display -->
    <div id="qrCode" class="flex justify-center mt-6"></div>

    <!-- Download button -->
    <button id="downloadBtn" onclick="downloadQR()" style="display:none;"
      class="mt-4 w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition">
      Download QR Code
    </button>
  </div>

  <script>
    function generateQR() {
      let qrText = document.getElementById("qrText").value;
      let qrSize = parseInt(document.getElementById("qrSize").value);
      let qrColorDark = document.getElementById("qrColorDark").value;
      let qrColorLight = document.getElementById("qrColorLight").value;

      let qrContainer = document.getElementById("qrCode");
      let downloadBtn = document.getElementById("downloadBtn");

      qrContainer.innerHTML = ""; // clear old QR
      downloadBtn.style.display = "none";

      if (qrText.trim() === "") {
        alert("Please enter text or a URL!");
        return;
      }

      new QRCode(qrContainer, {
        text: qrText,
        width: qrSize,
        height: qrSize,
        colorDark: qrColorDark,
        colorLight: qrColorLight
      });

      setTimeout(() => {
        downloadBtn.style.display = "block";
      }, 500);
    }

    function downloadQR() {
      let qrCanvas = document.querySelector("#qrCode canvas");
      let qrImage = qrCanvas.toDataURL("image/png");

      let link = document.createElement("a");
      link.href = qrImage;
      link.download = "qrcode.png";
      link.click();
    }
  </script>
</body>
</html> {% endcomment %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi QR Code Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Wi-Fi QR Generator</h1>

    <!-- Wi-Fi SSID -->
    <input id="ssid" type="text" placeholder="Wi-Fi SSID"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 mb-3">

    <!-- Password -->
    <input id="password" type="text" placeholder="Wi-Fi Password"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 mb-3">

    <!-- Encryption type -->
    <select id="encryption" class="w-full px-4 py-2 border rounded-lg mb-4">
      <option value="WPA">WPA/WPA2</option>
      <option value="WEP">WEP</option>
      <option value="">None</option>
    </select>

    <!-- Generate Button -->
    <button onclick="generateWiFiQR()" 
      class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg transition mb-4">
      Generate QR Code
    </button>

    <!-- QR display -->
    <div id="wifiQR" class="flex justify-center mt-4"></div>

    <!-- Download button -->
    <button id="downloadBtn" onclick="downloadWiFiQR()" style="display:none;"
      class="mt-4 w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition">
      Download QR Code
    </button>
  </div>

  <script>
    function generateWiFiQR() {
      let ssid = document.getElementById("ssid").value.trim();
      let password = document.getElementById("password").value;
      let encryption = document.getElementById("encryption").value;
      let qrContainer = document.getElementById("wifiQR");
      let downloadBtn = document.getElementById("downloadBtn");

      qrContainer.innerHTML = ""; // clear old QR
      downloadBtn.style.display = "none";

      if (!ssid) {
        alert("Please enter Wi-Fi SSID!");
        return;
      }

      // Wi-Fi QR code format
      let qrText = `WIFI:T:${encryption};S:${ssid};P:${password};;`;

      new QRCode(qrContainer, {
        text: qrText,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff"
      });

      setTimeout(() => {
        downloadBtn.style.display = "block";
      }, 500);
    }

    function downloadWiFiQR() {
      let qrCanvas = document.querySelector("#wifiQR canvas");
      if (!qrCanvas) return;

      let qrImage = qrCanvas.toDataURL("image/png");
      let link = document.createElement("a");
      link.href = qrImage;
      link.download = "wifi-qrcode.png";
      link.click();
    }
  </script>

</body>
</html>
